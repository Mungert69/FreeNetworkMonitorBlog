<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin webmaster@localhost
        ServerName devblog.readyforquantum.com  
                ErrorLog ${APACHE_LOG_DIR}/error.log
                CustomLog ${APACHE_LOG_DIR}/access.log combined
                SSLEngine on
                SSLCertificateFile      server.crt
                SSLCertificateKeyFile server.key
        

        DocumentRoot /var/www/html

        <Directory /var/www/html>
            Options FollowSymLinks
            AllowOverride All
            Require all granted
            
            RewriteEngine On
            RewriteBase /

            # Old main-site/static blog entry points consolidate to the blog root.
            RewriteRule ^blog(?:/index\.html)?/?$ / [R=301,L,NC]

            # Consolidated categories redirect before file and 404 handling.
            IncludeOptional /var/www/html/.category-redirects.conf
            <Files ".category-redirects.conf">
                Require all denied
            </Files>

            # Serve real files/directories directly.
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Resolve extensionless Next export routes to .html.
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.+?)/?$ $1.html [L]

            # If request looks like a static asset but does not exist, return 404.
            RewriteCond %{REQUEST_URI} \.[A-Za-z0-9]{1,8}$ [NC]
            RewriteRule ^ - [R=404,L]

            # Unknown routes should be 404 (avoid soft-404 homepage fallbacks).
            RewriteRule ^ - [R=404,L]
        </Directory>

    </VirtualHost>
</IfModule>
